name: Signed Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          echo "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$RUNNER_TEMP/release.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/release.keychain-db"

      - name: Prepare App Store Connect key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$ASC_PRIVATE_KEY_BASE64"
          echo "$ASC_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and sign app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          IDENTITY="$(security find-identity -v -p codesigning "$RUNNER_TEMP/release.keychain-db" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY"
          VERSION="$VERSION" SIGNING_IDENTITY="$IDENTITY" ./build.sh
          codesign --verify --deep --strict --verbose=2 dist/MacVimSwitch.app

      - name: Notarize app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent dist/MacVimSwitch.app "$RUNNER_TEMP/MacVimSwitch.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MacVimSwitch.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/MacVimSwitch.app
          xcrun stapler validate dist/MacVimSwitch.app

      - name: Create and notarize DMG
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IDENTITY="$(security find-identity -v -p codesigning "$RUNNER_TEMP/release.keychain-db" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          mkdir "$RUNNER_TEMP/dmg-root"
          cp -R dist/MacVimSwitch.app "$RUNNER_TEMP/dmg-root/"
          ln -s /Applications "$RUNNER_TEMP/dmg-root/Applications"
          hdiutil create -volname MacVimSwitch -srcfolder "$RUNNER_TEMP/dmg-root" -ov -format UDZO MacVimSwitch.dmg
          codesign --force --sign "$IDENTITY" --timestamp MacVimSwitch.dmg
          xcrun notarytool submit MacVimSwitch.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple MacVimSwitch.dmg
          xcrun stapler validate MacVimSwitch.dmg
          shasum -a 256 MacVimSwitch.dmg > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            MacVimSwitch.dmg \
            SHA256SUMS.txt \
            --title "MacVimSwitch $GITHUB_REF_NAME" \
            --notes-file "release-notes/$GITHUB_REF_NAME.md"
